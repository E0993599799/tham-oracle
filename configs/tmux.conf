# Oracle tmux configuration
# Minimal statusline + basic keybindings
# Load with: tmux source-file configs/tmux.conf

# ============================================================================
# STATUS LINE (Oracle branded)
# ============================================================================

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-bg colour235
set -g status-fg colour245

# Left: session name (bold blue)
set -g status-left-length 30
set -g status-left "#[bg=colour39,fg=colour232,bold] 🧠 #S #[bg=colour235,fg=colour39]"

# Right: time + date
set -g status-right-length 50
set -g status-right "#[fg=colour39]#[bg=colour39,fg=colour232] %H:%M | %a %d/%m "

# Windows: current highlighted
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=colour39,fg=colour232,bold] #I:#W "

set -g window-status-separator " "

# ============================================================================
# GENERAL OPTIONS
# ============================================================================

set -g mouse off
set -g history-limit 5000
set -g default-terminal "screen-256color"
set -g set-titles on
set -g set-titles-string "#S:#I:#W"

# ============================================================================
# KEY BINDINGS
# ============================================================================

# Vi-like pane navigation (hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easier new window / split
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"
bind "%" split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ============================================================================
# PANE & WINDOW
# ============================================================================

set -g pane-border-status off
set -g pane-border-lines heavy

# Border colors
set -g pane-border-fg colour240
set -g pane-active-border-fg colour39

# ============================================================================
# COLOR SCHEME (Catppuccin-inspired minimal)
# ============================================================================

set -g mode-style "bg=colour39,fg=colour232"
set -g message-style "bg=colour235,fg=colour39"
set -g message-command-style "bg=colour235,fg=colour39"
