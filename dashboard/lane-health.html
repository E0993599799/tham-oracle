<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lane Health Dashboard — Omega OS Router</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Monaco', 'Consolas', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #00ff41;
        }
        h1 {
            color: #00ff41;
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }
        .subtitle {
            color: #808080;
            font-size: 0.9em;
        }
        .timestamp {
            color: #606060;
            font-size: 0.85em;
            margin-top: 5px;
        }
        .lane-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .lane-card {
            background: rgba(20, 30, 60, 0.8);
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }
        .lane-card:hover {
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            transform: translateY(-2px);
        }
        .lane-card.healthy {
            border-color: #00ff41;
        }
        .lane-card.degraded {
            border-color: #ffaa00;
        }
        .lane-card.down {
            border-color: #ff4444;
        }
        .lane-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .lane-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #00ff41;
        }
        .lane-status {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-healthy {
            background: rgba(0, 255, 65, 0.2);
            color: #00ff41;
        }
        .status-degraded {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
        }
        .status-down {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }
        .lane-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9em;
            line-height: 1.6;
        }
        .stat-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 4px;
            border-left: 2px solid #00ff41;
        }
        .stat-label {
            color: #808080;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-value {
            color: #00ff41;
            font-size: 1.1em;
            margin-top: 4px;
            font-weight: bold;
        }
        .stats-section {
            background: rgba(20, 30, 60, 0.8);
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .stats-section h2 {
            color: #00ff41;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #00ff41;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        th {
            background: rgba(0, 255, 65, 0.1);
            border-bottom: 2px solid #00ff41;
            padding: 10px;
            text-align: left;
            color: #00ff41;
        }
        td {
            border-bottom: 1px solid #333333;
            padding: 10px;
        }
        tr:hover {
            background: rgba(0, 255, 65, 0.05);
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            background: #00ff41;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .footer {
            text-align: center;
            color: #606060;
            font-size: 0.85em;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333333;
        }
        .error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .loading {
            color: #808080;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Lane Health Dashboard</h1>
            <p class="subtitle">Omega OS Router — Real-Time Observability</p>
            <p class="timestamp">Last updated: <span id="last-update">loading...</span></p>
        </header>

        <div id="error-container"></div>

        <div class="lane-grid" id="lane-grid">
            <div class="loading">Loading lane health data...</div>
        </div>

        <div class="stats-section">
            <h2>📊 Daily Summary</h2>
            <table id="summary-table">
                <thead>
                    <tr>
                        <th>Metric</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody id="summary-tbody">
                    <tr>
                        <td colspan="2" class="loading">Loading summary...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            <p>Omega OS Phase 3 — Dashboard + Writeback Integration</p>
            <p>Auto-refreshes every 10 seconds</p>
        </div>
    </div>

    <script>
        const REPO_ROOT = '/root/ghq/github.com/E0993599799/tham-oracle';
        const HEALTH_CHECK_SCRIPT = './scripts/router-health-check.sh';
        const PROOFS_DIR = './proofs';
        const REFRESH_INTERVAL = 10000; // 10 seconds

        function formatTime(isoString) {
            const d = new Date(isoString);
            return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function statusClass(status) {
            switch(status) {
                case 'healthy': return 'status-healthy';
                case 'degraded': return 'status-degraded';
                case 'down': return 'status-down';
                default: return 'status-healthy';
            }
        }

        async function loadHealthData() {
            try {
                // For local file access, we'll simulate health data
                // In a real deployment, this would fetch from the health-check script
                const healthData = await simulateHealthCheck();
                renderLanes(healthData.lanes);
                renderSummary(healthData.lanes);
                document.getElementById('last-update').textContent = formatTime(healthData.timestamp);
                document.getElementById('error-container').innerHTML = '';
            } catch (error) {
                document.getElementById('error-container').innerHTML = 
                    `<div class="error">⚠️ Error loading health data: ${error.message}</div>`;
            }
        }

        async function simulateHealthCheck() {
            // Simulate health check data based on current time
            // In production, this would read from router-health-check.sh output
            return {
                timestamp: new Date().toISOString(),
                lanes: [
                    { lane_id: 'codex_gpt55', status: 'healthy', response_time_ms: 145, success_rate_pct: 92.5, circuit_breaker_state: 'CLOSED' },
                    { lane_id: 'claude', status: 'healthy', response_time_ms: 198, success_rate_pct: 95.0, circuit_breaker_state: 'CLOSED' },
                    { lane_id: 'gemini', status: 'degraded', response_time_ms: 350, success_rate_pct: 88.0, circuit_breaker_state: 'CLOSED' },
                    { lane_id: 'ollama', status: 'healthy', response_time_ms: 120, success_rate_pct: 90.0, circuit_breaker_state: 'CLOSED' },
                    { lane_id: 'hermes', status: 'down', response_time_ms: 5000, success_rate_pct: 0.0, circuit_breaker_state: 'OPEN' },
                    { lane_id: 'powershell_sfsr', status: 'healthy', response_time_ms: 50, success_rate_pct: 100.0, circuit_breaker_state: 'CLOSED' }
                ]
            };
        }

        function renderLanes(lanes) {
            const grid = document.getElementById('lane-grid');
            grid.innerHTML = lanes.map(lane => `
                <div class="lane-card ${lane.status}">
                    <div class="lane-header">
                        <span class="lane-name">${lane.lane_id}</span>
                        <span class="lane-status ${statusClass(lane.status)}">${lane.status.toUpperCase()}</span>
                    </div>
                    <div class="lane-stats">
                        <div class="stat-item">
                            <div class="stat-label">Response Time</div>
                            <div class="stat-value">${lane.response_time_ms}ms</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Success Rate</div>
                            <div class="stat-value">${lane.success_rate_pct.toFixed(1)}%</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${lane.success_rate_pct}%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="stat-item" style="margin-top: 10px; grid-column: 1/-1;">
                        <div class="stat-label">Circuit Breaker</div>
                        <div class="stat-value">${lane.circuit_breaker_state}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderSummary(lanes) {
            const healthy = lanes.filter(l => l.status === 'healthy').length;
            const degraded = lanes.filter(l => l.status === 'degraded').length;
            const down = lanes.filter(l => l.status === 'down').length;
            const avgResponseTime = (lanes.reduce((sum, l) => sum + l.response_time_ms, 0) / lanes.length).toFixed(0);
            const avgSuccessRate = (lanes.reduce((sum, l) => sum + l.success_rate_pct, 0) / lanes.length).toFixed(1);

            const tbody = document.getElementById('summary-tbody');
            tbody.innerHTML = `
                <tr>
                    <td>Total Lanes</td>
                    <td>${lanes.length}</td>
                </tr>
                <tr>
                    <td>Healthy</td>
                    <td><span style="color: #00ff41">${healthy}</span></td>
                </tr>
                <tr>
                    <td>Degraded</td>
                    <td><span style="color: #ffaa00">${degraded}</span></td>
                </tr>
                <tr>
                    <td>Down</td>
                    <td><span style="color: #ff4444">${down}</span></td>
                </tr>
                <tr>
                    <td>Avg Response Time</td>
                    <td>${avgResponseTime}ms</td>
                </tr>
                <tr>
                    <td>Avg Success Rate</td>
                    <td>${avgSuccessRate}%</td>
                </tr>
            `;
        }

        // Initial load
        loadHealthData();

        // Auto-refresh
        setInterval(loadHealthData, REFRESH_INTERVAL);
    </script>
</body>
</html>
