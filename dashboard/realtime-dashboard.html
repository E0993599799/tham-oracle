<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Live Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            overflow-x: hidden;
        }

        #app {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #334155;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: -0.5px;
        }

        #ws-status {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            border: 1px solid #334155;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        input[type="date"],
        select,
        input[type="search"],
        button {
            padding: 10px 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        input[type="date"]:hover,
        select:hover,
        input[type="search"]:hover,
        button:hover {
            border-color: #475569;
            background: #1a1f35;
        }

        input[type="date"]:focus,
        select:focus,
        input[type="search"]:focus,
        button:focus {
            outline: none;
            border-color: #3b82f6;
            background: #1a1f35;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        button {
            background: #3b82f6;
            border-color: #3b82f6;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: #2563eb;
            border-color: #2563eb;
        }

        button:active {
            transform: scale(0.98);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .button-group button {
            flex: 1;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .metric-card {
            padding: 20px;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .metric-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .metric-secondary {
            font-size: 12px;
            color: #64748b;
            margin-top: 8px;
        }

        .filters-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .filter-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .filter-checkbox:hover {
            border-color: #475569;
            background: #1a1f35;
        }

        .filter-checkbox input[type="checkbox"] {
            cursor: pointer;
        }

        .filter-checkbox input[type="checkbox"]:checked + label {
            color: #3b82f6;
        }

        .table-container {
            overflow-x: auto;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #0f172a;
            border-bottom: 2px solid #334155;
            position: sticky;
            top: 0;
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            font-size: 11px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            color: #e2e8f0;
        }

        tr:hover {
            background: #0f172a;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-success {
            background: #10b981;
            color: #ecfdf5;
        }

        .status-error {
            background: #ef4444;
            color: #fef2f2;
        }

        .status-pending {
            background: #f59e0b;
            color: #fffbeb;
        }

        .risk-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .risk-low {
            background: #10b981;
            color: #ecfdf5;
        }

        .risk-medium {
            background: #f59e0b;
            color: #fffbeb;
        }

        .risk-high {
            background: #ef4444;
            color: #fef2f2;
        }

        .lane-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            background: #3b82f6;
            color: #dbeafe;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: #f1f5f9;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
            font-size: 13px;
        }

        .detail-label {
            font-weight: 600;
            color: #94a3b8;
        }

        .detail-value {
            color: #e2e8f0;
            word-break: break-all;
        }

        .export-btn {
            background: #10b981;
            border-color: #10b981;
        }

        .export-btn:hover {
            background: #059669;
            border-color: #059669;
        }

        .reconnect-btn {
            background: #f59e0b;
            border-color: #f59e0b;
        }

        .reconnect-btn:hover {
            background: #d97706;
            border-color: #d97706;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .search-highlight {
            background: #334155;
        }

        @media (max-width: 768px) {
            #app {
                padding: 10px;
            }

            h1 {
                font-size: 20px;
            }

            header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .controls-section {
                grid-template-columns: 1fr;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>🚀 Router Live Dashboard</h1>
            <div id="ws-status">
                <span class="status-dot disconnected" id="status-dot"></span>
                <span id="status-text">Connecting...</span>
                <button class="reconnect-btn" id="reconnect-btn" style="display: none; margin-left: 10px; padding: 6px 12px; font-size: 12px;">Reconnect</button>
            </div>
        </header>

        <div class="controls-section">
            <div class="control-group">
                <label for="date-picker">Select Date</label>
                <input type="date" id="date-picker" />
            </div>

            <div class="control-group">
                <label>Playback Controls</label>
                <div class="button-group">
                    <button id="play-btn">▶ Play</button>
                    <button id="pause-btn">⏸ Pause</button>
                </div>
            </div>

            <div class="control-group">
                <label for="speed">Playback Speed</label>
                <select id="speed">
                    <option value="0.5">0.5x</option>
                    <option value="1" selected>1x</option>
                    <option value="2">2x</option>
                    <option value="4">4x</option>
                </select>
            </div>

            <div class="control-group">
                <label></label>
                <button class="export-btn" id="export-btn">⬇ Export CSV</button>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Success Rate</div>
                <div class="metric-value" id="success-rate">0%</div>
                <div class="metric-secondary" id="success-count">0 / 0 tasks</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Total Tasks</div>
                <div class="metric-value" id="task-count">0</div>
                <div class="metric-secondary">Today</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Avg Duration</div>
                <div class="metric-value" id="avg-duration">0s</div>
                <div class="metric-secondary" id="duration-count">0 completed</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Lane Activity</div>
                <div class="metric-value" id="activity-rate">0/min</div>
                <div class="metric-secondary">Last minute</div>
            </div>
        </div>

        <div class="filters-section">
            <span class="filter-label">Lane Filter:</span>
            <div class="filter-group">
                <label class="filter-checkbox">
                    <input type="checkbox" data-lane="codex_gpt55" checked />
                    <span>Codex GPT55</span>
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" data-lane="ollama" checked />
                    <span>Ollama</span>
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" data-lane="gemini" checked />
                    <span>Gemini</span>
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" data-lane="claude" checked />
                    <span>Claude</span>
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" data-lane="hermes" checked />
                    <span>Hermes</span>
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" data-lane="powershell_sfsr" checked />
                    <span>PowerShell</span>
                </label>
            </div>
            <input type="search" id="task-search" placeholder="Search task_id..." style="margin-left: auto;" />
        </div>

        <div class="table-container">
            <table id="proofs-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Task ID</th>
                        <th>Lane</th>
                        <th>Status</th>
                        <th>Duration</th>
                        <th>Risk</th>
                    </tr>
                </thead>
                <tbody id="proofs-body">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: #64748b;">
                            <div class="empty-state">
                                <div class="empty-state-icon">📡</div>
                                <p>Waiting for connection...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="details-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Proof Details</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        class DashboardManager {
            constructor() {
                this.ws = null;
                this.proofs = [];
                this.filteredProofs = [];
                this.isConnected = false;
                this.isPlaying = false;
                this.playbackSpeed = 1;
                this.playbackIndex = 0;
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 5;
                this.selectedDate = new Date().toISOString().split('T')[0];
                this.activeLaneFilters = new Set(['codex_gpt55', 'ollama', 'gemini', 'claude', 'hermes', 'powershell_sfsr']);
                this.searchQuery = '';
                this.lastActivityTime = Date.now();
                this.activityLog = [];

                this.initializeElements();
                this.attachEventListeners();
                this.loadPreferences();
                this.setTodayDate();
                this.connect();
            }

            initializeElements() {
                this.elements = {
                    wsStatus: document.getElementById('ws-status'),
                    statusDot: document.getElementById('status-dot'),
                    statusText: document.getElementById('status-text'),
                    reconnectBtn: document.getElementById('reconnect-btn'),
                    datePicker: document.getElementById('date-picker'),
                    playBtn: document.getElementById('play-btn'),
                    pauseBtn: document.getElementById('pause-btn'),
                    speedSelect: document.getElementById('speed'),
                    proofBody: document.getElementById('proofs-body'),
                    taskSearch: document.getElementById('task-search'),
                    successRate: document.getElementById('success-rate'),
                    successCount: document.getElementById('success-count'),
                    taskCount: document.getElementById('task-count'),
                    avgDuration: document.getElementById('avg-duration'),
                    durationCount: document.getElementById('duration-count'),
                    activityRate: document.getElementById('activity-rate'),
                    exportBtn: document.getElementById('export-btn'),
                    modal: document.getElementById('details-modal'),
                    modalClose: document.getElementById('modal-close'),
                    modalTitle: document.getElementById('modal-title'),
                    modalBody: document.getElementById('modal-body'),
                    laneCheckboxes: document.querySelectorAll('.filter-checkbox input[type="checkbox"]')
                };
            }

            attachEventListeners() {
                this.elements.datePicker.addEventListener('change', () => this.onDateChanged());
                this.elements.playBtn.addEventListener('click', () => this.startPlayback());
                this.elements.pauseBtn.addEventListener('click', () => this.stopPlayback());
                this.elements.speedSelect.addEventListener('change', (e) => {
                    this.playbackSpeed = parseFloat(e.target.value);
                });
                this.elements.taskSearch.addEventListener('input', (e) => {
                    this.searchQuery = e.target.value.toLowerCase();
                    this.updateTable();
                });
                this.elements.exportBtn.addEventListener('click', () => this.exportCSV());
                this.elements.reconnectBtn.addEventListener('click', () => this.reconnect());
                this.elements.modalClose.addEventListener('click', () => this.closeModal());

                this.elements.laneCheckboxes.forEach(checkbox => {
                    checkbox.addEventListener('change', () => {
                        const lane = checkbox.dataset.lane;
                        if (checkbox.checked) {
                            this.activeLaneFilters.add(lane);
                        } else {
                            this.activeLaneFilters.delete(lane);
                        }
                        this.updateTable();
                        this.savePreferences();
                    });
                });

                document.addEventListener('click', (e) => {
                    if (e.target === this.elements.modal) {
                        this.closeModal();
                    }
                });
            }

            setTodayDate() {
                const today = new Date().toISOString().split('T')[0];
                this.elements.datePicker.value = today;
            }

            connect() {
                try {
                    this.ws = new WebSocket('ws://localhost:8765');

                    this.ws.onopen = () => {
                        this.isConnected = true;
                        this.reconnectAttempts = 0;
                        this.updateStatus(true);
                        console.log('WebSocket connected');
                    };

                    this.ws.onmessage = (event) => {
                        try {
                            const proof = JSON.parse(event.data);
                            if (proof.task_id) {
                                this.addProof(proof);
                            }
                        } catch (e) {
                            console.error('Error parsing proof:', e);
                        }
                    };

                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                    };

                    this.ws.onclose = () => {
                        this.isConnected = false;
                        this.updateStatus(false);
                        this.attemptReconnect();
                    };
                } catch (e) {
                    console.error('Connection error:', e);
                    this.attemptReconnect();
                }
            }

            attemptReconnect() {
                if (this.reconnectAttempts >= this.maxReconnectAttempts) {
                    this.updateStatus(false, 'Connection failed');
                    this.elements.reconnectBtn.style.display = 'inline-block';
                    return;
                }

                const delay = Math.pow(2, this.reconnectAttempts) * 1000;
                this.reconnectAttempts++;
                console.log(`Reconnecting in ${delay}ms...`);
                setTimeout(() => this.connect(), delay);
            }

            reconnect() {
                this.reconnectAttempts = 0;
                this.elements.reconnectBtn.style.display = 'none';
                this.updateStatus(false, 'Reconnecting...');
                this.connect();
            }

            updateStatus(connected, customText = null) {
                if (connected) {
                    this.elements.statusDot.className = 'status-dot connected';
                    this.elements.statusText.textContent = 'Connected';
                } else {
                    this.elements.statusDot.className = 'status-dot disconnected';
                    this.elements.statusText.textContent = customText || 'Disconnected';
                }
            }

            addProof(proof) {
                this.proofs.unshift(proof);
                this.lastActivityTime = Date.now();
                this.activityLog.push(Date.now());

                if (this.proofs.length > 1000) {
                    this.proofs = this.proofs.slice(0, 1000);
                }

                this.updateMetrics();
                this.updateTable();
                this.savePreferences();
            }

            async onDateChanged() {
                const selectedDate = this.elements.datePicker.value;
                if (selectedDate !== this.selectedDate) {
                    this.selectedDate = selectedDate;
                    this.playbackIndex = 0;
                    this.stopPlayback();
                    await this.loadHistoricalProofs(selectedDate);
                }
            }

            async loadHistoricalProofs(date) {
                try {
                    const response = await fetch(`http://localhost:8766/api/proofs?date=${date}`);
                    if (!response.ok) throw new Error('Failed to load proofs');

                    const proofs = await response.json();
                    this.proofs = proofs;
                    this.updateMetrics();
                    this.updateTable();
                    console.log(`Loaded ${proofs.length} proofs for ${date}`);
                } catch (e) {
                    console.error('Error loading historical proofs:', e);
                    if (this.proofs.length === 0) {
                        this.showEmptyState('Failed to load proofs. Make sure API server is running.');
                    }
                }
            }

            startPlayback() {
                if (this.proofs.length === 0) return;

                this.isPlaying = true;
                this.playbackIndex = 0;
                this.playProof();
            }

            playProof() {
                if (!this.isPlaying || this.playbackIndex >= this.proofs.length) {
                    this.isPlaying = false;
                    return;
                }

                const proof = this.proofs[this.playbackIndex];
                this.playbackIndex++;
                this.updateTable();

                const delay = 1000 / this.playbackSpeed;
                setTimeout(() => this.playProof(), delay);
            }

            stopPlayback() {
                this.isPlaying = false;
                this.playbackIndex = 0;
            }

            updateMetrics() {
                const today = new Date().toISOString().split('T')[0];
                const isToday = this.selectedDate === today;

                let successCount = 0;
                let totalCount = 0;
                let totalDuration = 0;
                let completedCount = 0;

                this.proofs.forEach(proof => {
                    totalCount++;
                    if (proof.status === 'SUCCESS') {
                        successCount++;
                    }
                    if (proof.duration && proof.duration > 0) {
                        totalDuration += proof.duration;
                        completedCount++;
                    }
                });

                const successRate = totalCount > 0 ? Math.round((successCount / totalCount) * 100) : 0;
                const avgDuration = completedCount > 0 ? (totalDuration / completedCount).toFixed(2) : 0;

                this.elements.successRate.textContent = `${successRate}%`;
                this.elements.successCount.textContent = `${successCount} / ${totalCount} tasks`;
                this.elements.taskCount.textContent = totalCount;
                this.elements.avgDuration.textContent = `${avgDuration}s`;
                this.elements.durationCount.textContent = `${completedCount} completed`;

                const activityCount = isToday ? this.getLastMinuteActivity() : 0;
                this.elements.activityRate.textContent = `${activityCount}/min`;
            }

            getLastMinuteActivity() {
                const oneMinuteAgo = Date.now() - 60000;
                return this.activityLog.filter(time => time > oneMinuteAgo).length;
            }

            updateTable() {
                this.filteredProofs = this.proofs.filter(proof => {
                    const matchLane = this.activeLaneFilters.has(proof.routed_lane || 'unknown');
                    const matchSearch = !this.searchQuery || (proof.task_id && proof.task_id.toLowerCase().includes(this.searchQuery));
                    return matchLane && matchSearch;
                });

                if (this.filteredProofs.length === 0) {
                    this.showEmptyState('No proofs match your filters');
                    return;
                }

                const visibleProofs = this.isPlaying
                    ? this.filteredProofs.slice(0, this.playbackIndex)
                    : this.filteredProofs;

                const rows = visibleProofs.map(proof => this.createProofRow(proof)).join('');
                this.elements.proofBody.innerHTML = rows;

                document.querySelectorAll('.proof-row').forEach(row => {
                    row.addEventListener('click', () => {
                        const taskId = row.dataset.taskId;
                        const proof = this.proofs.find(p => p.task_id === taskId);
                        if (proof) this.showProofDetails(proof);
                    });
                });
            }

            showEmptyState(message) {
                this.elements.proofBody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: #64748b;">
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <p>${message}</p>
                            </div>
                        </td>
                    </tr>
                `;
            }

            createProofRow(proof) {
                const timestamp = proof.timestamp
                    ? new Date(proof.timestamp).toLocaleTimeString()
                    : 'N/A';
                const statusClass = `status-${proof.status.toLowerCase()}`;
                const riskClass = `risk-${(proof.risk_level || 'low').toLowerCase()}`;
                const duration = proof.duration ? `${proof.duration.toFixed(2)}s` : 'N/A';

                return `
                    <tr class="proof-row" data-task-id="${proof.task_id}">
                        <td>${timestamp}</td>
                        <td>${proof.task_id}</td>
                        <td><span class="lane-badge">${proof.routed_lane || 'unknown'}</span></td>
                        <td><span class="status-badge ${statusClass}">${proof.status}</span></td>
                        <td>${duration}</td>
                        <td><span class="risk-badge ${riskClass}">${proof.risk_level || 'low'}</span></td>
                    </tr>
                `;
            }

            showProofDetails(proof) {
                this.elements.modalTitle.textContent = `Proof: ${proof.task_id}`;

                const details = `
                    <div class="detail-row">
                        <span class="detail-label">Task ID</span>
                        <span class="detail-value">${proof.task_id}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Lane</span>
                        <span class="detail-value">${proof.routed_lane || 'unknown'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value"><span class="status-badge status-${proof.status.toLowerCase()}">${proof.status}</span></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Duration</span>
                        <span class="detail-value">${proof.duration ? proof.duration.toFixed(2) + 's' : 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Risk Level</span>
                        <span class="detail-value"><span class="risk-badge risk-${(proof.risk_level || 'low').toLowerCase()}">${proof.risk_level || 'low'}</span></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Timestamp</span>
                        <span class="detail-value">${proof.timestamp || 'N/A'}</span>
                    </div>
                    ${proof.proof_summary ? `
                        <div class="detail-row">
                            <span class="detail-label">Summary</span>
                            <span class="detail-value">${proof.proof_summary}</span>
                        </div>
                    ` : ''}
                    ${proof.source_file ? `
                        <div class="detail-row">
                            <span class="detail-label">Source File</span>
                            <span class="detail-value">${proof.source_file}</span>
                        </div>
                    ` : ''}
                `;

                this.elements.modalBody.innerHTML = details;
                this.elements.modal.classList.add('active');
            }

            closeModal() {
                this.elements.modal.classList.remove('active');
            }

            exportCSV() {
                let csv = 'Timestamp,Task ID,Lane,Status,Duration (s),Risk Level\n';
                this.filteredProofs.forEach(proof => {
                    const timestamp = proof.timestamp || 'N/A';
                    const duration = proof.duration || 'N/A';
                    csv += `"${timestamp}","${proof.task_id}","${proof.routed_lane || 'unknown'}","${proof.status}","${duration}","${proof.risk_level || 'low'}"\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `proofs-${this.selectedDate}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }

            savePreferences() {
                const prefs = {
                    activeLaneFilters: Array.from(this.activeLaneFilters),
                    selectedDate: this.selectedDate
                };
                localStorage.setItem('dashboardPrefs', JSON.stringify(prefs));
            }

            loadPreferences() {
                const prefs = localStorage.getItem('dashboardPrefs');
                if (prefs) {
                    try {
                        const parsed = JSON.parse(prefs);
                        if (parsed.activeLaneFilters) {
                            this.activeLaneFilters = new Set(parsed.activeLaneFilters);
                            this.elements.laneCheckboxes.forEach(checkbox => {
                                checkbox.checked = this.activeLaneFilters.has(checkbox.dataset.lane);
                            });
                        }
                        if (parsed.selectedDate) {
                            this.selectedDate = parsed.selectedDate;
                            this.elements.datePicker.value = parsed.selectedDate;
                        }
                    } catch (e) {
                        console.error('Error loading preferences:', e);
                    }
                }
            }
        }

        // Initialize dashboard on page load
        let dashboard;
        document.addEventListener('DOMContentLoaded', () => {
            dashboard = new DashboardManager();
        });
    </script>
</body>
</html>
